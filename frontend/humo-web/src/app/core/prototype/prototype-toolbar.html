@if (open()) {
  <section class="panel" aria-label="Prototype controls">
    <header>
      <div>
        <div class="title">Prototype controls</div>
        <div class="sub">Not part of the product — for reviewing roles and states.</div>
      </div>
      <button type="button" class="btn btn-ghost btn-icon btn-sm" (click)="open.set(false)" aria-label="Close prototype controls">
        <ion-icon name="close-outline" aria-hidden="true" />
      </button>
    </header>

    <div class="label-caps group-label" id="proto-persona">View as</div>
    <div class="personas" role="radiogroup" aria-labelledby="proto-persona">
      @for (p of session.personas; track p.id) {
        <button
          type="button"
          role="radio"
          class="persona"
          [attr.aria-checked]="session.persona().id === p.id"
          (click)="choosePersona(p.id)"
        >
          <span class="avatar">{{ p.initials }}</span>
          <span class="persona-text">
            <span class="role">
              {{ roleLabels[p.memberships[0].role] }}
              @if (p.memberships.length > 1) {
                <span class="multi">+{{ p.memberships.length - 1 }} role</span>
              }
            </span>
            <span class="who">{{ p.name }} · {{ p.memberships[0].label }}</span>
          </span>
        </button>
      }
    </div>

    <div class="label-caps group-label" id="proto-state">Page state</div>
    <div class="segmented" role="radiogroup" aria-labelledby="proto-state">
      @for (s of states; track s.value) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="proto.viewState() === s.value"
          (click)="proto.viewState.set(s.value)"
        >
          {{ s.label }}
        </button>
      }
    </div>

    <label class="toggle">
      <input type="checkbox" [checked]="proto.latency()" (change)="proto.latency.set(!proto.latency())" />
      Simulate network latency
    </label>
  </section>
}

<button
  type="button"
  class="fab"
  [class.active]="open()"
  (click)="open.set(!open())"
  [attr.aria-expanded]="open()"
  aria-label="Prototype controls"
>
  <ion-icon name="flask-outline" aria-hidden="true" />
  <span class="fab-text">
    <span class="fab-label">Prototype</span>
    <span class="fab-role">{{ roleLabels[session.role()] }}</span>
  </span>
  @if (proto.viewState() !== 'live') {
    <span class="fab-state">{{ proto.viewState() }}</span>
  }
</button>
