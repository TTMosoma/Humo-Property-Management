<div class="search-row">
  <ion-icon name="search-outline" aria-hidden="true" />
  <input
    #input
    type="text"
    placeholder="Search pages and schemes…"
    aria-label="Search pages and schemes"
    role="combobox"
    aria-controls="palette-results"
    aria-expanded="true"
    autocomplete="off"
    spellcheck="false"
    [value]="query()"
    (input)="query.set(input.value)"
    (keydown)="onKeydown($event)"
  />
  <kbd>Esc</kbd>
</div>

<div class="results" id="palette-results" role="listbox" #list>
  @for (g of groups(); track g.kind) {
    <div class="group-label label-caps">{{ g.kind }}</div>
    @for (r of g.items; track r.item.id) {
      <button
        type="button"
        class="result"
        role="option"
        tabindex="-1"
        [attr.aria-selected]="r.index === cursor()"
        (mouseenter)="cursor.set(r.index)"
        (click)="open(r.item)"
      >
        <ion-icon [name]="r.item.icon" aria-hidden="true" />
        <span class="label">{{ r.item.label }}</span>
        <span class="hint">{{ r.item.hint }}</span>
        @if (r.index === cursor()) {
          <ion-icon class="enter" name="return-down-back-outline" aria-hidden="true" />
        }
      </button>
    }
  } @empty {
    <div class="empty">
      No pages or schemes match “{{ query() }}”.
      <span>Units, people and suppliers will be searchable in later checkpoints.</span>
    </div>
  }
</div>

<div class="foot">
  <span><kbd>↑</kbd><kbd>↓</kbd> to move</span>
  <span><kbd>Enter</kbd> to open</span>
</div>
