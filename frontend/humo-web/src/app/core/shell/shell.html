<ion-split-pane contentId="main-content" when="lg" [class.rail]="railCollapsed()">
  <ion-menu contentId="main-content" menuId="main" type="overlay">
    <app-sidebar
      [collapsed]="railCollapsed()"
      [canCollapse]="isDesktop()"
      (toggleCollapse)="toggleCollapse()"
      (navigated)="closeMenu()"
    />
  </ion-menu>

  <div class="ion-page" id="main-content">
    <app-topbar [showMenuButton]="!isDesktop()" (openMenu)="openMenu()" (openPalette)="openPalette()" />
    @if (supportAgency(); as a) {
      <div class="support-banner" role="status">
        <ion-icon name="eye-outline" aria-hidden="true" />
        <span>Support view: <strong>{{ a.name }}</strong>. Read-only — every page you open is logged for the agency’s audit trail.</span>
        <button type="button" (click)="session.viewAgency(null)">Exit support view</button>
      </div>
    }
    <main class="content" #scroller>
      <div class="content-inner">
        <app-breadcrumbs />
        <router-outlet />
      </div>
    </main>
    @if (showTabBar()) {
      <app-mobile-tab-bar (more)="openMenu()" (search)="openPalette()" />
    }
  </div>
</ion-split-pane>

<app-prototype-toolbar />
