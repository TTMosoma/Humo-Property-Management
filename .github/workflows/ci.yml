# Humo Property Management: checks on every pull request and on main (P1-1).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/humo-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/humo-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/humo-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check (both apps and the tests)
        run: npm run typecheck

      - name: Lint (ESLint, including templates)
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          # Calendar dates are South African dates; run the tests where they're used.
          TZ: Africa/Johannesburg

      - name: Production build (Humo API only)
        run: npm run build

      # R-6: a production bundle must never contain the simulation or its demo data.
      - name: No demo data in the production build
        run: |
          if grep -rlE "Acacia Managing Agents|humo\.sim\.|MockPrototypeControls" dist/humo-web/browser; then
            echo "::error::The production build contains mock or demo code (docs/18 R-6)."
            exit 1
          fi

      # R-7: the demo's "not for search engines" settings must never reach production.
      - name: No demo hosting settings in the production build
        run: |
          if [ -e dist/humo-web/browser/robots.txt ] || [ -e dist/humo-web/browser/_headers ] || [ -e dist/humo-web/browser/_redirects ]; then
            echo "::error::The production build carries demo hosting files (docs/18 R-7)."
            exit 1
          fi

      - name: Demo build (pm-demo.humo.co.za)
        run: npm run build:demo

      - name: Demo build carries its hosting settings
        run: |
          grep -q "Disallow: /" dist/humo-web/browser/robots.txt
          grep -q "X-Robots-Tag: noindex" dist/humo-web/browser/_headers

      - name: Humo Contractor build
        run: npm run build:contractor

  # The Humo API (backend/): restore with the vulnerability audit, build, tests, a start-up
  # against real PostgreSQL (migrations, the first administrator, sign-in answers), and the image.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: humo
          POSTGRES_USER: humo
          POSTGRES_PASSWORD: humo-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humo -d humo"
          --health-interval 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      # NuGet's audit runs here: a package with a known vulnerability fails the build (warnings are errors).
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Tests
        run: dotnet test -c Release --no-build

      - name: Start against PostgreSQL (migrations, bootstrap, sign-in answers)
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5080
          ConnectionStrings__Humo: Host=localhost;Port=5432;Database=humo;Username=humo;Password=humo-ci-only
          Bootstrap__AdminEmail: ci@humo.co.za
          Bootstrap__AdminName: CI Administrator
          Mail__Provider: Log
          # CI only: signs file links. The API refuses to start without a key (Files:SigningKey).
          Files__SigningKey: 1koFV8PLkhl0uNVjH31FEz/8ZRmck4FEoFNoozVmSLI=
        run: |
          dotnet run -c Release --no-build --no-launch-profile --project src/Humo.Api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5080/api/health && break; sleep 2; done
          curl -sf http://localhost:5080/api/health || { cat api.log; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/api/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"ci@humo.co.za"}' http://localhost:5080/api/auth/link)" = "202"
          grep -q "Sign in at https://pm.humo.co.za/sign-in" api.log || { cat api.log; exit 1; }

      - name: Docker image
        working-directory: .
        run: docker build -f backend/Dockerfile -t humo-api:ci .
